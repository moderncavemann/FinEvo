name: EGRM CI

on:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "EGRM/**"
      - ".github/workflows/egrm-ci.yml"
  pull_request:
    paths:
      - "EGRM/**"
      - ".github/workflows/egrm-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: EGRM / Python 3.12.7 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      PYTHONPATH: ${{ github.workspace }}/EGRM/src

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: |
            EGRM/pyproject.toml
            .github/workflows/egrm-ci.yml

      - name: Install test dependency
        run: python -m pip install pytest==8.4.2

      - name: Check dependency consistency
        run: python -m pip check

      - name: Verify complete Git source provenance
        run: >-
          python EGRM/scripts/validate_provenance.py
          --manifest EGRM/provenance/SOURCE_PROVENANCE.json
          --source-repo-root .

      - name: Run EGRM tests
        run: >-
          python -m pytest -q -p no:cacheprovider
          EGRM/tests
          --junitxml="${RUNNER_TEMP}/egrm-test-results.xml"

      - name: Run controlled fixture twice
        shell: bash
        run: |
          set -euo pipefail
          for replica in a b; do
            python EGRM/scripts/run_controlled_benchmark.py \
              --contract EGRM/configs/controlled_benchmark_v1.json \
              --output "${RUNNER_TEMP}/egrm-controlled-${replica}.json" \
              >"${RUNNER_TEMP}/egrm-controlled-${replica}.stdout.json"
          done
          cmp \
            "${RUNNER_TEMP}/egrm-controlled-a.json" \
            "${RUNNER_TEMP}/egrm-controlled-b.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "egrm-controlled-a.json").read_text()
          )
          assert result["fixture_passed"] is True
          assert result["scope"] == "deterministic_implementation_fixture"
          assert result["scientific_evidence"] is False
          assert result["observed"] == {
              "supported_lifecycle": ["provisional", "active", "active", "retired"],
              "unsupported_final_status": "rejected",
              "unverified_unsupported_ever_active_count": 1,
              "verified_unsupported_ever_active_count": 0,
          }
          PY

      - name: Expand non-dispatchable scientific design twice
        shell: bash
        run: |
          set -euo pipefail
          for replica in a b; do
            python EGRM/scripts/expand_scientific_design.py \
              --contract EGRM/configs/scientific_contract_v1.json \
              --output "${RUNNER_TEMP}/egrm-design-${replica}.json" \
              >"${RUNNER_TEMP}/egrm-design-${replica}.stdout.json"
          done
          cmp \
            "${RUNNER_TEMP}/egrm-design-a.json" \
            "${RUNNER_TEMP}/egrm-design-b.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "egrm-design-a.json").read_text()
          )
          assert result["contract_status"] == "design_draft_not_run"
          assert result["dispatchable"] is False
          assert result["scientific_evidence"] is False
          assert result["budget_authorization"] == "not_authorized_by_this_release"
          assert result["registered_cells"] == 105
          assert result["stage_counts"] == {
              "E0-known-truth-ruleswitch": 48,
              "E1-fresh-closed-loop": 25,
              "E2-checkpoint-continuation": 20,
              "E3-second-model-diagnostic": 12,
          }
          PY

      - name: Compile tracked EGRM Python sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          tracked = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "EGRM"]
          ).split(b"\0")
          sources = sorted(
              Path(raw.decode("utf-8"))
              for raw in tracked
              if raw and raw.endswith(b".py")
          )
          if not sources:
              raise SystemExit("no tracked EGRM Python sources found")
          for source in sources:
              compile(source.read_bytes(), source.as_posix(), "exec")
          print(f"compiled {len(sources)} tracked EGRM Python sources")
          PY

      - name: Scan tracked EGRM files for high-confidence secrets
        if: runner.os == 'Linux'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          rules = {
              "private-key": re.compile(
                  rb"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"
              ),
              "aws-access-key": re.compile(rb"\b(?:AKIA|ASIA)[0-9A-Z]{16}\b"),
              "google-api-key": re.compile(rb"\bAIza[0-9A-Za-z_-]{35}\b"),
              "github-token": re.compile(
                  rb"\b(?:gh[pousr]_[A-Za-z0-9]{36,255}|"
                  rb"github_pat_[A-Za-z0-9_]{40,255})\b"
              ),
              "provider-api-key": re.compile(
                  rb"\bsk-(?:proj-|svcacct-|ant-api\d{2}-)?[A-Za-z0-9_-]{20,}\b"
              ),
          }
          tracked = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "EGRM"]
          ).split(b"\0")
          findings = []
          scanned = 0
          for raw_path in tracked:
              if not raw_path:
                  continue
              path = Path(raw_path.decode("utf-8"))
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              scanned += 1
              for label, pattern in rules.items():
                  for match in pattern.finditer(data):
                      line = data.count(b"\n", 0, match.start()) + 1
                      findings.append((path.as_posix(), line, label))
          if findings:
              for path, line, label in findings:
                  print(f"{path}:{line}: possible {label}")
              raise SystemExit(
                  f"found {len(findings)} high-confidence secret candidate(s)"
              )
          print(f"scanned {scanned} tracked EGRM text files; no secrets found")
          PY

      - name: Check tracked-tree hygiene and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files -s -- EGRM | awk '$1 == "120000" { print $4 }' | grep -q .; then
            echo "tracked EGRM symlinks are forbidden"
            exit 1
          fi
          if git ls-files -- EGRM | grep -E '(^|/)(__pycache__|build|dist|outputs)(/|$)|\.py[co]$|\.egg-info/' ; then
            echo "generated EGRM artifacts must not be tracked"
            exit 1
          fi
          git diff --check
          git diff --exit-code
          status=$(git status --porcelain=v1 --untracked-files=all)
          if [[ -n "${status}" ]]; then
            printf '%s\n' "EGRM checks left the checkout dirty:" "${status}"
            exit 1
          fi
